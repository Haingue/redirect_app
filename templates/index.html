<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirection en cours...</title>
<link rel="stylesheet" href="/tailwind.min.css">
<style>
  body { background: linear-gradient(135deg,#1e3a8a 0%,#1e40af 40%,#3b82f6 100%); }
  .progress-bar { transition: width 1s linear; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-8 md:p-10 text-center">
    <div class="mx-auto mb-6 flex items-center justify-center h-16 w-16 rounded-full bg-blue-100">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6" />
      </svg>
    </div>

    <h1 class="text-2xl font-bold text-gray-800 mb-2">__MESSAGE_TITLE__</h1>
    <p class="text-gray-600 mb-6">__MESSAGE__</p>

    <div class="bg-gray-50 border border-gray-200 rounded-lg px-4 py-3 mb-6 break-all">
      <span class="text-sm text-gray-500">Nouvelle adresse :</span>
      <a href="__REDIRECT_URL__" class="block font-mono text-blue-700 font-semibold mt-1 hover:underline">__REDIRECT_URL__</a>
    </div>

    <div id="countdown-wrapper" class="mb-6">
      <p class="text-sm text-gray-500 mb-2">
        Redirection automatique dans <span id="seconds" class="font-bold text-blue-700">__DELAY__</span> seconde(s)
      </p>
      <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
        <div id="progress-bar" class="progress-bar bg-blue-600 h-2 rounded-full" style="width:100%"></div>
      </div>
    </div>

    <div id="cancelled-message" class="hidden mb-6">
      <p class="text-sm font-medium text-red-600">Redirection automatique annulée.</p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button id="redirect-now" data-url="__REDIRECT_URL__"
        class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-colors">
        Rediriger maintenant
      </button>
      <button id="cancel-btn"
        class="inline-flex items-center justify-center px-5 py-2.5 rounded-lg bg-gray-100 text-gray-700 font-semibold hover:bg-gray-200 transition-colors">
        Annuler la redirection
      </button>
    </div>
  </div>

  <script>
    (function () {
      var delay = parseInt(document.getElementById("seconds").textContent, 10) || 10;
      var remaining = delay;
      var redirectBtn = document.getElementById("redirect-now");
      var url = redirectBtn.getAttribute("data-url");
      var secondsEl = document.getElementById("seconds");
      var progressBar = document.getElementById("progress-bar");
      var countdownWrapper = document.getElementById("countdown-wrapper");
      var cancelledMessage = document.getElementById("cancelled-message");
      var cancelBtn = document.getElementById("cancel-btn");
      var timer = null;

      function tick() {
        remaining -= 1;
        if (remaining <= 0) {
          clearInterval(timer);
          window.location.href = url;
          return;
        }
        secondsEl.textContent = remaining;
        progressBar.style.width = (remaining / delay * 100) + "%";
      }

      timer = setInterval(tick, 1000);

      redirectBtn.addEventListener("click", function () {
        window.location.href = url;
      });

      cancelBtn.addEventListener("click", function () {
        clearInterval(timer);
        countdownWrapper.classList.add("hidden");
        cancelledMessage.classList.remove("hidden");
        cancelBtn.disabled = true;
        cancelBtn.classList.add("opacity-50", "cursor-not-allowed");
      });
    })();
  </script>
</body>
</html>
